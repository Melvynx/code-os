{{template "auth-open" .}}
      <section class="card" aria-labelledby="login-title">
        <header class="card-header">
          <h1 id="login-title" class="card-title">{{.Heading}}</h1>
          <p class="card-description">{{.Description}}</p>
        </header>

        <div class="card-content">
          {{if .InvalidCredentials}}
            <div id="login-error" class="alert alert-destructive" role="alert">
              <div class="alert-title">Sign-in failed</div>
              <div class="alert-description">The username or password is incorrect.</div>
            </div>
          {{end}}

          <form method="post" action="{{.FormAction}}">
            <input type="hidden" name="next" value="{{.Next}}" />
            <div class="field">
              <label class="field-label" for="username">Username</label>
              <input
                id="username"
                class="input"
                name="username"
                type="text"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
                required
                autofocus
                {{if .InvalidCredentials}}aria-invalid="true" aria-describedby="login-error"{{end}}
              />
            </div>

            <div class="field">
              <label class="field-label" for="password">Password</label>
              <input
                id="password"
                class="input"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                {{if .InvalidCredentials}}aria-invalid="true" aria-describedby="login-error"{{end}}
              />
            </div>
            <button class="button" type="submit">Sign in</button>
          </form>
        </div>

        <footer class="card-footer">Session lasts 12 hours. HttpOnly, SameSite=Strict.</footer>
      </section>
{{template "auth-close" .}}
